# Blueprint de deploy na Render (https://render.com)
# Serviço único: a API (Express) também serve o front buildado.
# O banco Postgres é criado automaticamente e ligado via DATABASE_URL.
services:
  - type: web
    name: brobond-erp
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && cd ../client && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: brobond-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@brobond.com.br
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: brobond-db
    databaseName: brobond
    plan: free
