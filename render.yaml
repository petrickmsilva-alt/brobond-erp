# Blueprint de deploy na Render (https://render.com)
# Serviço único: a API (Express) também serve o front buildado.
# As tabelas (db/schema.sql) são criadas/migradas pela própria API ao iniciar.
#
# BANCO DE DADOS: o Postgres gratuito da Render expira após 30 dias e apaga os
# dados. Por isso DATABASE_URL é configurada manualmente no painel (sync: false)
# apontando para um banco gratuito PERMANENTE — recomendação: Neon (neon.tech).
# Se preferir o banco da Render (plano pago), troque por:
#   - key: DATABASE_URL
#     fromDatabase: { name: brobond-db, property: connectionString }
# e reative a seção `databases` no fim do arquivo.
services:
  - type: web
    name: brobond-erp
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && cd ../client && npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      # Endereço público do ERP: base dos links enviados por e-mail (convite de
      # acesso, redefinição de senha), do portal do cliente e das etiquetas QR.
      # Defina no painel com o domínio que os usuários realmente usam, ex.
      # https://brobond-erp.onrender.com ou https://erp.brobond.com.br.
      # Sem isso o link usa o cabeçalho da requisição (Render: ok; domínio
      # próprio atrás de proxy: pode sair errado e virar "URL inválida").
      - key: APP_URL
        sync: false
      # Fotos: "db" (no banco, padrão) ou "cloudinary" (+ CLOUDINARY_URL)
      - key: UPLOAD_PROVIDER
        value: db
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Chave dedicada para CIFRAR os segredos MFA (TOTP) em repouso.
      # Se ausente, deriva do JWT_SECRET — defina uma própria e não a troque.
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@brobond.com.br
      - key: ADMIN_PASSWORD
        sync: false
      # Só mude para "true" para recuperar o acesso do admin (redefine a senha
      # para ADMIN_PASSWORD no próximo deploy). Volte para "false" em seguida.
      - key: ADMIN_FORCE_PASSWORD
        value: "false"
      # Sentry (monitoramento de erros frontend) — crie em https://sentry.io
      - key: VITE_SENTRY_DSN
        sync: false

