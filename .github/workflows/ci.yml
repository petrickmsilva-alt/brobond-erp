# Verificação automática a cada push / pull request:
# tipos (server + client), testes das regras de negócio, lint, build do front e um job
# de integração contra Postgres real (migrações + atomicidade de saldo).
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm run install:all && npm install
      - name: Typecheck (API)
        run: npm --prefix server run typecheck
      - name: Typecheck (front)
        run: npm --prefix client run typecheck
      - name: Testes das regras de negócio
        run: npm --prefix server test
      - name: Validar schema Prisma unificado (fusão commerce)
        run: npx prisma validate
        env:
          # O `validate` não conecta no banco — mas exige que a variável
          # referenciada em env("DATABASE_URL") no schema EXISTA (P1012).
          # O job `verificar` não tem Postgres; um placeholder basta.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Lint
        run: npm run lint
      - name: Build do front
        run: npm --prefix client run build

  # As regras de saldo e o runner de migração só podem ser provados contra um
  # Postgres de verdade (o modo demonstração não tem isolamento por transação).
  testes-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brobond
          POSTGRES_PASSWORD: brobond
          POSTGRES_DB: brobond_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brobond -d brobond_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://brobond:brobond@localhost:5432/brobond_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências da API
        run: npm --prefix server install
      - name: Migrations + concorrência de saldo no Postgres
        # Em caso de falha, ecoa o diagnóstico como annotation do check-run:
        # é a única janela para o log quando o download de artefatos não está
        # disponível. (node --test fala TAP; falhas saem como "not ok".)
        run: |
          set -o pipefail
          npm --prefix server run test:pg 2>&1 | tee /tmp/testpg.log || {
            DIAG="$( { grep -E "^not ok|failureType|^  error|code: |name: |Migração .* falhou|Error \[|ERR_" /tmp/testpg.log | head -40; echo "--- cauda ---"; tail -40 /tmp/testpg.log; } | sed 's/%/%25/g' )"
            echo "::error title=testpg falhou::${DIAG//$'\n'/%0A}"
            exit 1
          }
      # Dual-track da fusão: o boot do ERP já criou as tabelas do commerce
      # (db/schema.sql + db/migrations/0012); a migration Prisma precisa
      # aplicar por cima sem erro (SQL idempotente) e ser registrada em
      # _prisma_migrations.
      - name: Instalar CLI Prisma (raiz)
        run: npm install --include=dev --no-audit --no-fund
      # P3005 ("database schema is not empty"): sem histórico em
      # _prisma_migrations o `migrate deploy` se recusa a rodar em banco
      # já populado pelo boot. A fusão (20261005120000) já foi aplicada
      # pelo runner do ERP com o MESMO SQL — marcar como baseline é o
      # procedimento oficial (https://pris.ly/d/migrate-baseline) e é
      # idempotente: se já está registrada, seguimos para o deploy.
      - name: Baseline da fusão (o boot do ERP já aplicou o mesmo SQL)
        run: npx prisma migrate resolve --applied "20261005120000_fusion_commerce_into_erp" || echo "baseline já registrado — seguindo"
      - name: Migration Prisma fusion_commerce_into_erp (dual-track)
        run: npx prisma migrate deploy
