# Verificação automática a cada push / pull request:
# tipos (server + client), testes das regras de negócio, lint, build do front e um job
# de integração contra Postgres real (migrações + atomicidade de saldo).
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm run install:all && npm install
      - name: Typecheck (API)
        run: npm --prefix server run typecheck
      - name: Typecheck (front)
        run: npm --prefix client run typecheck
      - name: Testes das regras de negócio
        run: |
          export ADMIN_PASSWORD="$(node -e "process.stdout.write('A!' + require('crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$ADMIN_PASSWORD"
          npm --prefix server test
      - name: Testes client
        run: npm --prefix client test
      - name: Smoke em memória (não substitui o gate PG)
        run: |
          export BROBOND_TEST_ADMIN_PASSWORD="$(node -e "process.stdout.write('A!' + require('crypto').randomBytes(24).toString('hex'))")"
          export BROBOND_TEST_NEW_PASSWORD="$(node -e "process.stdout.write('B!' + require('crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$BROBOND_TEST_ADMIN_PASSWORD"
          echo "::add-mask::$BROBOND_TEST_NEW_PASSWORD"
          export ADMIN_PASSWORD="$BROBOND_TEST_ADMIN_PASSWORD"
          env -u DATABASE_URL PORT=3001 node --import tsx server/src/index.ts > /tmp/smoke-demo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null 2>&1 && grep -q 'Administrador:' /tmp/smoke-demo.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/smoke-demo.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/smoke-demo.log; exit 1; fi
          npm run smoke
      - name: Auditoria do menu
        run: npm run audit:menu
      # Gate BROBOND COMMERCE OS (P0/P1/P2): modelo, rotas, RBAC de fluxo,
      # webhook assinado, zero modal, testes e docs. P0 aberto = exit 1.
      - name: Gate Commerce go-live (READY/BLOCKED)
        run: npm run commerce:go-live
      # ERP 3.0: inventário arquitetural automatizado (migrations, tabelas,
      # recursos × tenant × Prisma, rotas, RBAC, testes). Falha se um recurso
      # apontar para tabela inexistente, declarar empresa sem `empresa_id` ou
      # se o Prisma mapear uma tabela que o ERP não cria.
      - name: Inventário arquitetural (ERP 3.0)
        run: npm run architecture:audit
      - name: Typecheck do domínio
        run: npm run typecheck:domain
      - name: Validar schema Prisma unificado (fusão commerce)
        run: npx prisma validate
        env:
          # O `validate` não conecta no banco — mas exige que a variável
          # referenciada em env("DATABASE_URL") no schema EXISTA (P1012).
          # O job `verificar` não tem Postgres; um placeholder basta.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Lint
        run: npm run lint
      - name: Build do front
        run: npm --prefix client run build

  # As regras de saldo e o runner de migração só podem ser provados contra um
  # Postgres de verdade (o modo demonstração não tem isolamento por transação).
  testes-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Versão oficial das evidências ERP-02.1; manter alinhada ao PostgreSQL local 16.14.
        image: postgres:16.14
        env:
          POSTGRES_USER: brobond
          POSTGRES_PASSWORD: brobond
          POSTGRES_DB: brobond_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brobond -d brobond_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://brobond:brobond@localhost:5432/brobond_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências (raiz)
        run: npm install
      - name: Configurar credencial efêmera para testes PostgreSQL
        run: |
          value="$(node -e "process.stdout.write('A!' + require('crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$value"
          echo "ADMIN_PASSWORD=$value" >> "$GITHUB_ENV"
      # O wrapper real do script E4.2 (PROD-DB-01.5.1) executa o arquivo via
      # psql, com o mesmo `\if :apply / BEGIN / COMMIT / ROLLBACK` do operador.
      # Sem o binário o teste se auto-pula e o gate REPROVA (skip não é
      # aprovação), então instalamos o cliente aqui.
      - name: Instalar cliente PostgreSQL (psql) para o teste do wrapper E4.2
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          psql --version
      - name: Confirmar versão oficial PostgreSQL 16.14
        working-directory: server
        run: |
          node --input-type=commonjs <<'NODE'
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          (async () => {
            try {
              await client.connect();
              const { rows: versionRows } = await client.query('SHOW server_version');
              const { rows: numberRows } = await client.query("SELECT current_setting('server_version_num') AS server_version_num");
              const actual = versionRows[0]?.server_version;
              const actualNum = Number(numberRows[0]?.server_version_num);
              console.log(`PostgreSQL server_version=${actual} (server_version_num=${actualNum})`);
              if (actualNum !== 160014) throw new Error(`Expected PostgreSQL 16.14 (160014), got ${actual} (${actualNum})`);
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Migrations + concorrência de saldo no Postgres
        # Em caso de falha, ecoa o diagnóstico como annotation do check-run:
        # é a única janela para o log quando o download de artefatos não está
        # disponível. (node --test fala TAP; falhas saem como "not ok".)
        run: |
          set -o pipefail
          npm run test:pg 2>&1 | tee /tmp/testpg.log || {
            DIAG="$( { grep -E "^not ok|failureType|^  error|code: |name: |Migração .* falhou|Error \[|ERR_" /tmp/testpg.log | head -40; echo "--- cauda ---"; tail -40 /tmp/testpg.log; } | sed 's/%/%25/g' )"
            echo "::error title=testpg falhou::${DIAG//$'\n'/%0A}"
            exit 1
          }
      - name: Coordenação de cron — processos independentes em banco descartável
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          try {
            await client.connect();
            await client.query('CREATE DATABASE brobond_test_cron_lock');
            await client.query('CREATE DATABASE brobond_test_cron_jobs');
          } finally { await client.end(); }
          NODE
          export CRON_LOCK_TEST_DATABASE_URL="${DATABASE_URL%/*}/brobond_test_cron_lock"
          export CRON_JOBS_TEST_DATABASE_URL="${DATABASE_URL%/*}/brobond_test_cron_jobs"
          npm run test:cron-lock:pg
      # Recovery ANTES das migrações Prisma: source e target devem ter o
      # mesmo schema (apenas SQL). Se rodar depois do prisma migrate deploy,
      # o source teria tenant_id em sales (via Prisma migration
      # 20261005130000_unified_order) mas o target não, fazendo o restore
      # falhar com "column tenant_id of relation sales does not exist".
      - name: Recovery — backup restaura em banco vazio (D8)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run recovery:check 2>&1 | tee /tmp/recovery.log || {
            DIAG="$( { grep -E "❌|Error|error:|restauração|violates" /tmp/recovery.log | head -30; echo "--- cauda ---"; tail -30 /tmp/recovery.log; } | sed 's/%/%25/g' )"
            echo "::error title=recovery falhou::${DIAG//$'\n'/%0A}"
            exit 1
          }

      - name: Instalar CLI Prisma (raiz)
        if: ${{ !cancelled() }}
        run: npm install --include=dev --no-audit --no-fund
      # P3005 ("database schema is not empty"): sem histórico em
      # _prisma_migrations o `migrate deploy` se recusa a rodar em banco
      # já populado pelo boot. A fusão (20261005120000) já foi aplicada
      # pelo runner do ERP com o MESMO SQL — marcar como baseline é o
      # procedimento oficial (https://pris.ly/d/migrate-baseline) e é
      # idempotente: se já está registrada, seguimos para o deploy.
      - name: Baseline da fusão (o boot do ERP já aplicou o mesmo SQL)
        if: ${{ !cancelled() }}
        run: npx prisma migrate resolve --applied "20261005120000_fusion_commerce_into_erp"
      - name: Migration Prisma fusion_commerce_into_erp (dual-track)
        if: ${{ !cancelled() }}
        run: npx prisma migrate deploy
      # ---------------------------------------------------------------------
      # GATE DO ERP-03 (P0-04): o smoke E2E rodava só contra o modo
      # demonstração — onde a memória tem `locais.mock` e cadastros de exemplo —
      # e por isso dava 126/126 enquanto o mesmo sistema, em PostgreSQL
      # recém-migrado, dava 92/117 (25 × "A empresa ativa não possui um local de
      # estoque ativo"). O runner cria um BANCO NOVO, sobe a API de verdade
      # (migrate + ensureAdmin automáticos, ZERO SQL manual) e roda o smoke
      # contra ela, devolvendo o código de saída do smoke.
      - name: Smoke E2E contra PostgreSQL novo (gate ERP-03)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          export BROBOND_TEST_ADMIN_PASSWORD="$(node -e "process.stdout.write('A!' + require('crypto').randomBytes(24).toString('hex'))")"
          export BROBOND_TEST_NEW_PASSWORD="$(node -e "process.stdout.write('B!' + require('crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$BROBOND_TEST_ADMIN_PASSWORD"
          echo "::add-mask::$BROBOND_TEST_NEW_PASSWORD"
          npm run smoke:pg 2>&1 | tee /tmp/smokepg.log || {
            DIAG="$( { grep -E "^FAIL|❌|error|Error" /tmp/smokepg.log | head -40; echo "--- cauda ---"; tail -40 /tmp/smokepg.log; } | sed 's/%/%25/g' )"
            echo "::error title=smoke:pg falhou::${DIAG//$'\n'/%0A}"
            exit 1
          }
